<style>
/* Concept: the whole portfolio is one big cobalt pinboard. Prints, posters and logos are taped up in
   clusters, and you drag, scroll or tap the dock to fly between them. One deliberate look, no theme toggle. */
:root {
  --bg: #2336F2;
  --ink: #0C0A2E;
  --paper: #FFFFFF;
  --pink: #FF4F9A;
  --yellow: #FFD23F;
  --mint: #79F0C0;
  --lilac: #C9B8FF;
  --f-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --f-hand: 'Caveat Brush', 'Comic Sans MS', cursive;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --gx: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gb: max(16px, env(safe-area-inset-bottom, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow: hidden; }
html.list-mode { overflow: auto; }
body {
  margin: 0; background: var(--bg); color: #fff; font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; overflow: hidden;
}
html.list-mode body { overflow: visible; height: auto; min-height: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

/* the board */
.stage {
  position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg);
  background-image: radial-gradient(rgba(255, 255, 255, .3) 1.6px, transparent 1.8px);
  background-size: 44px 44px;
}
.stage.grab { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; width: 3600px; height: 2800px; transform-origin: 0 0; will-change: transform; }

.cl { position: absolute; margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 210px; line-height: 1; white-space: nowrap; color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, .38); pointer-events: none; user-select: none; rotate: -3deg; }

.intro { position: absolute; left: 240px; top: 740px; width: 900px; pointer-events: none; }
.intro .kicker { font-family: var(--f-hand); font-size: 34px; color: var(--yellow); margin: 0 0 6px; rotate: -3deg; display: inline-block; }
.intro h1 { font-family: var(--f-display); font-weight: 900; font-size: 190px; line-height: .92; letter-spacing: -.045em; margin: 0; text-transform: uppercase; }
.intro h1 span { display: block; }
.intro h1 span:nth-child(2) { color: var(--pink); -webkit-text-stroke: 0; margin-left: 70px; }
.intro .sub { font-size: 28px; font-weight: 700; max-width: 26ch; margin: 26px 0 0; line-height: 1.25; }
.say { pointer-events: auto; display: inline-flex; flex-direction: column; gap: 2px; margin-top: 30px; background: var(--yellow); color: var(--ink); padding: 14px 22px 16px; border-radius: 18px; rotate: 2deg; box-shadow: 8px 8px 0 var(--ink); }
.say span { font-family: var(--f-hand); font-size: 28px; line-height: 1; }
.say b { font-family: var(--f-display); font-weight: 700; font-size: 25px; user-select: all; }
.badge { position: absolute; right: -60px; top: -120px; width: 230px; height: 230px; animation: spin 18s linear infinite; }
.badge text { font-family: var(--f-display); font-weight: 700; font-size: 17px; fill: #fff; }
@keyframes spin { to { rotate: 360deg; } }
.note { position: absolute; left: 130px; top: 600px; font-family: var(--f-hand); font-size: 30px; margin: 0; rotate: -5deg; pointer-events: none; }
.note::after { content: "→"; margin-left: 10px; display: inline-block; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { translate: 12px 0; } }

/* prints */
.card {
  position: absolute; display: block; padding: 10px 10px 14px; border: 0; border-radius: 8px; background: var(--paper); color: var(--ink); text-align: left; cursor: pointer;
  rotate: var(--r, 0deg); box-shadow: 10px 12px 0 rgba(12, 10, 46, .85);
  transition: rotate .45s var(--ease), scale .45s var(--ease), box-shadow .45s var(--ease);
  animation: drop .8s var(--ease) backwards calc(var(--i) * 70ms + 150ms), bob var(--bob, 6s) ease-in-out infinite alternate calc(var(--i) * -.7s);
}
.card::before { content: ""; position: absolute; top: -13px; left: 50%; width: 92px; height: 28px; margin-left: -46px; background: rgba(255, 210, 63, .85); rotate: calc(var(--r, 0deg) * -1.4); z-index: 2; }
.card:hover, .card:focus-visible { rotate: 0deg; scale: 1.06; z-index: 20; box-shadow: 16px 18px 0 var(--ink); }
.card .pic { display: block; position: relative; width: 100%; overflow: hidden; border-radius: 3px; background: #E8E8F4; }
.card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .cap { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 11px; }
.card .cap b { font-family: var(--f-display); font-weight: 700; font-size: 13px; line-height: 1.2; letter-spacing: -.01em; }
.tag { flex: none; font-style: normal; font-weight: 800; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; color: var(--ink); }
.t-ui { background: var(--yellow); } .t-graphic { background: var(--pink); } .t-logo { background: var(--mint); } .t-tee { background: var(--lilac); }
.card .cnt { position: absolute; right: 8px; top: 8px; background: var(--ink); color: #fff; font-style: normal; font-weight: 800; font-size: 11px; padding: 3px 9px; border-radius: 999px; z-index: 3; }
@keyframes drop { from { opacity: 0; scale: .5; } }
@keyframes bob { from { translate: 0 -5px; } to { translate: 0 6px; } }

.ph { width: 100%; height: 100%; display: grid; place-items: center; background: linear-gradient(135deg, var(--pink), var(--bg)); }
.ph b { font-family: var(--f-display); font-size: 64px; font-weight: 900; color: #fff; }

/* chrome */
.hdr { position: fixed; z-index: 30; left: 0; right: 0; top: env(safe-area-inset-top, 0px); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px var(--gr) 0 var(--gx); pointer-events: none; }
.hdr > * { pointer-events: auto; }
html.list-mode .hdr { background: var(--bg); padding-bottom: 12px; }
.brand { display: inline-flex; align-items: center; gap: 9px; background: var(--paper); color: var(--ink); text-decoration: none; font-family: var(--f-display); font-weight: 900; font-size: 14px; padding: 10px 16px; border-radius: 999px; box-shadow: 4px 4px 0 var(--ink); }
.brand i { width: 11px; height: 19px; border-radius: 6px 6px 2px 2px; background: linear-gradient(var(--yellow), var(--pink)); display: inline-block; transform-origin: 50% 100%; animation: sway 3.4s ease-in-out infinite; }
@keyframes sway { 0%, 100% { rotate: -9deg; } 50% { rotate: 9deg; } }
.mailpill { display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; background: var(--yellow); color: var(--ink); font-weight: 800; font-size: 13px; padding: 10px 16px; border-radius: 999px; box-shadow: 4px 4px 0 var(--ink); transition: translate .25s var(--ease), box-shadow .25s; min-width: 0; }
.mailpill:hover { translate: -2px -2px; box-shadow: 6px 6px 0 var(--ink); }
.mailpill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.dock { position: fixed; z-index: 30; left: 50%; translate: -50% 0; bottom: var(--gb); display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: var(--ink); max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
.dock::-webkit-scrollbar { display: none; }
.dock button { border: 0; background: transparent; font-weight: 800; font-size: 13px; padding: 10px 15px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: background .25s, color .25s; }
.dock button:hover { background: rgba(255, 255, 255, .14); }
.dock button[aria-current="true"] { background: var(--yellow); color: var(--ink); }
.dock .sep { width: 1px; background: rgba(255, 255, 255, .2); margin: 6px 4px; flex: none; }
.dock .view { color: var(--mint); }

.hint { position: fixed; z-index: 25; left: 50%; translate: -50% 0; bottom: calc(var(--gb) + 66px); font-family: var(--f-hand); font-size: 26px; pointer-events: none; transition: opacity .6s; white-space: nowrap; }
.hint.gone { opacity: 0; }

.mini { position: fixed; z-index: 30; right: var(--gr); bottom: var(--gb); width: 150px; aspect-ratio: 3600 / 2800; background: rgba(12, 10, 46, .6); border-radius: 12px; cursor: pointer; overflow: hidden; border: 2px solid var(--ink); }
.mini i { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; }
.mini b { position: absolute; border: 2px solid var(--yellow); border-radius: 3px; pointer-events: none; }

/* list view */
.list { display: none; }
html.list-mode .list { display: block; padding: calc(env(safe-area-inset-top, 0px) + 84px) 0 calc(var(--gb) + 90px); max-width: 1200px; margin-inline: auto; }
html.list-mode .stage, html.list-mode .mini, html.list-mode .hint, html.list-mode .dock .jump, html.list-mode .dock .sep { display: none; }
.list h2 { font-family: var(--f-display); font-weight: 900; font-size: clamp(34px, 7vw, 76px); margin: 0 0 26px; line-height: 1; letter-spacing: -.03em; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 22px; }
.li { border: 0; padding: 10px 10px 14px; background: var(--paper); color: var(--ink); border-radius: 8px; text-align: left; cursor: pointer; box-shadow: 8px 8px 0 var(--ink); min-width: 0; transition: translate .3s var(--ease), box-shadow .3s; }
.li:hover { translate: -3px -3px; box-shadow: 11px 11px 0 var(--ink); }
.li .pic { display: block; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 3px; background: #E8E8F4; }
.li .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.li .cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
.li b { font-family: var(--f-display); font-size: 13px; font-weight: 700; line-height: 1.2; }

/* viewer */
.viewer { position: fixed; inset: 0; z-index: 100; background: rgba(10, 8, 38, .95); display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.viewer[hidden] { display: none; }
.viewer .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.viewer h3 { font-family: var(--f-display); font-weight: 900; font-size: clamp(18px, 3vw, 30px); margin: 0; letter-spacing: -.02em; }
.vbtn { border: 0; cursor: pointer; background: var(--yellow); color: var(--ink); font-weight: 800; font-size: 14px; padding: 10px 18px; border-radius: 999px; box-shadow: 3px 3px 0 #fff; }
.vbtn.sq { width: 42px; height: 42px; padding: 0; }
.viewer .stagev { min-height: 0; display: grid; place-items: center; }
.viewer .frame { width: min(1100px, 100%); height: 100%; display: grid; place-items: center; animation: pop .45s var(--ease); }
.viewer .frame img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; background: #fff; }
.viewer .frame .ph { aspect-ratio: 16 / 10; width: 100%; max-height: 100%; border-radius: 8px; }
@keyframes pop { from { opacity: 0; scale: .95; } }
.viewer .foot { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.viewer .foot p { margin: 0; max-width: 62ch; color: #D9D7F5; }
.viewer .np { display: flex; align-items: center; gap: 10px; }
.viewer .np span { font-weight: 800; min-width: 54px; text-align: center; }

@media (max-width: 720px) {
  .mini { display: none; }
  .mailpill span { max-width: 38vw; }
  .brand { font-size: 13px; padding: 9px 13px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

  b.style.cssText = 'left:' + p.x + 'px;top:' + p.y + 'px;width:' + p.w + 'px;--r:' + p.r + 'deg;--i:' + i + ';--bob:' + (5 + (i % 4)) + 's';
  b.setAttribute('aria-label', 'Open ' + p.title);
  var pic = el('span', 'pic'); pic.style.aspectRatio = String(p.ar);
  pic.appendChild(img_(p.cover || p.imgs[0], p, p.title));
  if (p.imgs.length > 1) pic.appendChild(el('i', 'cnt', p.imgs.length + ' pics'));
  b.appendChild(pic);
  b.appendChild(el('span', 'cap', '<b>' + p.title + '</b><i class="tag t-' + p.cat + '">' + TAGS[p.cat] + '</i>'));
  b.onclick = function () { if (dragged) { dragged = false; return; } openViewer(p, 0, b); };
  b.addEventListener('focus', function () { flyIfHidden(p.x + p.w / 2, p.y + 120); });
  world.appendChild(b); cards.push(b);
});

/* list view */
P.forEach(function (p) {
  var b = el('button', 'li'); b.type = 'button'; b.setAttribute('aria-label', 'Open ' + p.title);
  var pic = el('span', 'pic'); pic.appendChild(img_(p.cover || p.imgs[0], p, p.title)); b.appendChild(pic);
  b.appendChild(el('span', 'cap', '<b>' + p.title + '</b><i class="tag t-' + p.cat + '">' + TAGS[p.cat] + '</i>'));
  b.onclick = function () { openViewer(p, 0, b); };
  $('lgrid').appendChild(b);
});

/* ---------- camera ---------- */
var cam = { x: 700, y: 1200 }, S = 1, vw = innerWidth, vh = innerHeight, anim = 0, hinted = false;
function setScale() { vw = innerWidth; vh = innerHeight; S = Math.max(.5, Math.min(1, vw / 1500)); }
function clampCam() {
  var hw = vw / (2 * S), hh = vh / (2 * S);
  var lox = hw - 180, hix = WW - hw + 180, loy = hh - 180, hiy = WH - hh + 180;
  cam.x = lox > hix ? WW / 2 : Math.max(lox, Math.min(hix, cam.x));
  cam.y = loy > hiy ? WH / 2 : Math.max(loy, Math.min(hiy, cam.y));
}
var mini = $('mini'), mview = el('b'), dots = [];
P.forEach(function (p) { var d = el('i'); d.style.left = ((p.x + p.w / 2) / WW * 100) + '%'; d.style.top = ((p.y + 120) / WH * 100) + '%'; mini.appendChild(d); });
mini.appendChild(mview);
function apply() {
  clampCam();
  var tx = vw / 2 - cam.x * S, ty = vh / 2 - cam.y * S;
  world.style.transform = 'translate3d(' + tx + 'px,' + ty + 'px,0) scale(' + S + ')';
  stage.style.backgroundPosition = tx + 'px ' + ty + 'px';
  stage.style.backgroundSize = (44 * S) + 'px ' + (44 * S) + 'px';
  var w = vw / S / WW * 100, h = vh / S / WH * 100;
  mview.style.width = w + '%'; mview.style.height = h + '%';
  mview.style.left = ((cam.x - vw / S / 2) / WW * 100) + '%'; mview.style.top = ((cam.y - vh / S / 2) / WH * 100) + '%';
  updateNav();
}
function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = 0; } }
function flyTo(x, y, dur) {
  stopAnim();
  var sx = cam.x, sy = cam.y, t0 = performance.now(); dur = dur || 1000;
  (function step(t) {
    var k = Math.min(1, (t - t0) / dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    cam.x = sx + (x - sx) * e; cam.y = sy + (y - sy) * e; apply();
    anim = k < 1 ? requestAnimationFrame(step) : 0;
  })(t0);
}
function flyIfHidden(x, y) {
  var sx = (x - cam.x) * S + vw / 2, sy = (y - cam.y) * S + vh / 2;
  if (sx < 80 || sx > vw - 80 || sy < 100 || sy > vh - 100) flyTo(x, y, 700);
}

/* dock */
var dock = $('dock');
CL.forEach(function (c) {
  var b = el('button', 'jump', c.label); b.type = 'button'; b.setAttribute('data-k', c.k);
  b.onclick = function () { hideHint(); flyTo(c.x, c.y, 1100); };
  dock.appendChild(b);
});
dock.appendChild(el('span', 'sep'));
var vbtn = el('button', 'view', 'List view'); vbtn.type = 'button'; dock.appendChild(vbtn);
vbtn.onclick = function () {
  var on = document.documentElement.classList.toggle('list-mode');
  vbtn.textContent = on ? 'Board view' : 'List view';
  window.scrollTo(0, 0); if (!on) apply();
};
function updateNav() {
  var best = null, bd = 1e12;
  CL.forEach(function (c) { var d = Math.hypot(c.x - cam.x, (c.y - cam.y) * 1.2); if (d < bd) { bd = d; best = c; } });
  dock.querySelectorAll('.jump').forEach(function (b) { b.setAttribute('aria-current', b.getAttribute('data-k') === best.k ? 'true' : 'false'); });
}
$('home').onclick = function (e) { e.preventDefault(); flyTo(CL[0].x, CL[0].y, 1000); if (document.documentElement.classList.contains('list-mode')) vbtn.onclick(); };
mini.addEventListener('click', function (e) {
  var r = mini.getBoundingClientRect(); hideHint();
  flyTo((e.clientX - r.left) / r.width * WW, (e.clientY - r.top) / r.height * WH, 900);
});

/* drag, inertia, wheel, keys */
var drag = null, dragged = false, vel = { x: 0, y: 0 }, lastMove = 0, inert = 0;
function hideHint() { if (!hinted) { hinted = true; $('hint').classList.add('gone'); } }
stage.addEventListener('pointerdown', function (e) {
  if (e.button > 0) return;
  stopAnim(); cancelAnimationFrame(inert); dragged = false; vel.x = vel.y = 0;
  drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
});
addEventListener('pointermove', function (e) {
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (!dragged && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) { dragged = true; stage.classList.add('grab'); hideHint(); }
  if (!dragged) return;
  cam.x -= dx / S; cam.y -= dy / S;
  vel.x = vel.x * .4 + (dx / S) * .6; vel.y = vel.y * .4 + (dy / S) * .6; lastMove = performance.now();
  apply();
});
function endDrag() {
  if (!drag) return; drag = null; stage.classList.remove('grab');
  if (!dragged) return;
  if (performance.now() - lastMove > 90) return;
  (function glide() {
    cam.x -= vel.x; cam.y -= vel.y; vel.x *= .93; vel.y *= .93; apply();
    if (Math.abs(vel.x) > .15 || Math.abs(vel.y) > .15) inert = requestAnimationFrame(glide);
  })();
}
addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);
stage.addEventListener('wheel', function (e) {
  if (e.ctrlKey) return; e.preventDefault(); stopAnim(); hideHint();
  cam.x += e.deltaX / S; cam.y += e.deltaY / S; apply();
}, { passive: false });
addEventListener('keydown', function (e) {
  if (!$('viewer').hidden || document.documentElement.classList.contains('list-mode')) return;
  var k = e.key, d = 160 / S;
  if (k === 'ArrowLeft') cam.x -= d; else if (k === 'ArrowRight') cam.x += d; else if (k === 'ArrowUp') cam.y -= d; else if (k === 'ArrowDown') cam.y += d; else return;
  if (document.activeElement && document.activeElement.classList.contains('card')) return;
  e.preventDefault(); stopAnim(); hideHint(); apply();
});
addEventListener('resize', function () { setScale(); apply(); });

/* ---------- viewer ---------- */
var vp = null, vi = 0, opener = null;
function renderViewer() {
  var fr = $('v-frame'); fr.innerHTML = '';
  fr.appendChild(img_(vp.imgs[vi], vp, vp.title + ', image ' + (vi + 1)));
  $('v-count').textContent = (vi + 1) + ' / ' + vp.imgs.length;
}
function openViewer(p, i, from) {
  vp = p; vi = i; opener = from;
  $('v-title').textContent = p.title;
  $('v-text').textContent = CATS[p.cat] + '. ' + p.blurb;
  var multi = p.imgs.length > 1; $('v-prev').hidden = !multi; $('v-next').hidden = !multi; $('v-count').hidden = !multi;
  $('viewer').hidden = false; renderViewer(); $('v-close').focus();
}
function closeViewer() { $('viewer').hidden = true; if (opener) opener.focus({ preventScroll: true }); }
function step(d) { vi = (vi + d + vp.imgs.length) % vp.imgs.length; renderViewer(); }
$('v-close').onclick = closeViewer; $('v-prev').onclick = function () { step(-1); }; $('v-next').onclick = function () { step(1); };
addEventListener('keydown', function (e) {
  if ($('viewer').hidden) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowRight' && vp.imgs.length > 1) step(1);
  if (e.key === 'ArrowLeft' && vp.imgs.length > 1) step(-1);
  if (e.key === 'Tab') {
    var f = $('viewer').querySelectorAll('button:not([hidden])'); if (!f.length) return;
    var a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  }
});
$('viewer').addEventListener('click', function (e) { if (e.target === this || e.target.classList.contains('stagev')) closeViewer(); });

/* copy email */
function toast(t) { var o = $('toast'); o.textContent = t; o.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(function () { o.style.opacity = 0; }, 2200); }
$('copy').onclick = function () {
  var m = 'kulfiedesign07@gmail.com';
  function fail() { toast('Select the address in the Start section to copy it'); flyTo(CL[0].x, CL[0].y, 900); }
  try { navigator.clipboard.writeText(m).then(function () { toast('Email copied'); }, fail); } catch (e) { fail(); }
};

setScale(); apply();
</script>
